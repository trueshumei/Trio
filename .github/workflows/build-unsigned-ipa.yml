name: Build Trio (unsigned IPA)
run-name: Build unsigned Trio IPA (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-unsigned-ipa.yml

env:
  # Identifiers taken from the FlareStore provisioning profile.
  # The signed app must use exactly this App ID and one of the app groups the profile allows.
  SIGN_TEAM_ID: 6QP924JPP5
  SIGN_BUNDLE_ID: app.kale3184.meteor7979
  SIGN_APP_GROUP: group.26e9623801f7efff.1

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Write ConfigOverride.xcconfig
        run: |
          cat > ConfigOverride.xcconfig <<EOF
          DEVELOPER_TEAM = ${SIGN_TEAM_ID}
          DEVELOPMENT_TEAM = ${SIGN_TEAM_ID}
          BUNDLE_IDENTIFIER = ${SIGN_BUNDLE_ID}
          TRIO_APP_GROUP_ID = ${SIGN_APP_GROUP}
          EOF
          sed -i '' 's/^[[:space:]]*//' ConfigOverride.xcconfig
          cat ConfigOverride.xcconfig

      - name: Archive without code signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Trio.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | tail -n 200 || true
          test -d build/Trio.xcarchive/Products/Applications/Trio.app

      - name: Package Trio.ipa (app only, no Watch or extensions)
        run: |
          mkdir -p Payload
          cp -R build/Trio.xcarchive/Products/Applications/Trio.app Payload/
          # The FlareStore profile covers one App ID only, so extensions cannot be signed with it.
          rm -rf Payload/Trio.app/Watch Payload/Trio.app/PlugIns
          APP=Payload/Trio.app
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          GROUP=$(/usr/libexec/PlistBuddy -c "Print :AppGroupID" "$APP/Info.plist")
          echo "Bundle ID : $ID"
          echo "App group : $GROUP"
          test "$ID" = "$SIGN_BUNDLE_ID"
          test "$GROUP" = "$SIGN_APP_GROUP"
          zip -qry Trio.ipa Payload
          ls -lh Trio.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Trio-unsigned-ipa
          path: Trio.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build/xcodebuild.log
